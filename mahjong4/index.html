<!--
  =============================================================================
  BIZY'S GOLDFISH & KOI MAHJONG - you vs three computer players.
  Rules: American (NMJL-style, default, original sample card) or Hong Kong.
  One self-contained HTML file (inline CSS + JS, no network, works on file://).
  =============================================================================
  WRAP AS A NATIVE APP WITH CAPACITOR:
    npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/ios @capacitor/android
    mkdir www && cp index.html www/
    npx cap init "Mahjong 4" com.example.mahjong4 --web-dir=www
    npx cap add ios && npx cap add android && npx cap sync
    npx cap open ios   (or android)       -> build & run
  viewport-fit=cover + env(safe-area-inset-*) already handle notches.

  ARCHITECTURE (numbered banners in the <script>):
    1. CONFIG    - defaults: difficulties, match length, AI speed, flowers,
                   seven pairs, starting points, point unit, theme, seed.
    2. ENGINE    - PURE logic (no DOM): tiles & wall, shanten / win detection /
                   ukeire, scoring, and the Game state machine
                   (startHand -> act/respond ... -> end -> nextHand -> over).
    3. AI        - PURE logic: Easy / Medium / Hard decision functions.
       (2 and 3 sit between ENGINE-START and AI-END markers so Node tests and
        the headless simulator load exactly the shipped code.)
    4a. THEME    - tile art: 'koi' Goldfish & Koi (default) or 'classic';
                   SVG symbols in one sprite (CONFIG.THEME, setup toggle, ?theme=).
    4. RENDERING - tile faces (drawn CSS/SVG), table, hands, melds, ponds,
                   overlays; responsive sizing computed from the viewport.
    5. UI/INPUT  - setup screen, taps, claim prompts, buttons, help.
    6. LOOP      - drives AI turns with a configurable delay, waits for the
                   human when needed, shows per-hand results and final ranking.
    7. CARD      - POND_CARD (first AM section): the American card as DATA, one
                   line per hand {id, sec, pat, pts, x, shift, note}. The pattern
                   mini-language is documented at the top of that section; edit
                   or replace the card there (compileCard validates each line).
    8. AMERICAN  - PURE logic: AM tiles (152 + optional blanks), card compile /
                   matching / closest hands, and AM.Game (Charleston -> discard
                   <-> claim -> end). AMAI = American Easy / Medium / Hard.
                   (7 and 8 sit between the AM start/end markers for tests.)
    9. UI-AM     - (inlined into the UI) top-5 hands panel with pinning,
                   Charleston controls, calls, joker / blank swaps, full card
                   view (pauses the game), American results and help.
  Responsive: phones use --k = 1; tablets (iPad) scale all CSS px sizes by
  --k (up to 1.75) and tile sizes are recomputed from the viewport in fit().
  Debug/test hook: window.__mj   URL: ?seed=123  ?theme=classic|koi
  =============================================================================
-->

  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  /* Offline support (PWA): service worker only over http(s) - never on file:// or inside Capacitor. */
  if ('serviceWorker' in navigator) window.addEventListener('load', () => {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    /* A new build finished installing: reload now if no game is in progress, otherwise it is used next launch. */
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      const s = document.getElementById('setup'); if (had && s && !s.hidden && !window.__swReloaded) { window.__swReloaded = true; location.reload(); }
    });
  }); }</script>
<title>Bizy&rsquo;s Goldfish &amp; Koi Mahjong</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3a29; color: #f4efe2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .cjk { font-family: "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

  /* ---------------- tiles (all sizes derive from --w = tile width) ---------------- */
  .tl { position: relative; flex: none; width: var(--w, calc(24px * var(--k, 1))); height: calc(var(--w, calc(24px * var(--k, 1))) * 1.34); font-size: var(--w, calc(24px * var(--k, 1)));
        border-radius: .12em; line-height: 1; overflow: hidden;
        background: linear-gradient(155deg, #fffef7 0%, #f6eed6 60%, #e8dbb7 100%);
        box-shadow: inset .03em .03em 0 #fff, inset -.03em -.04em 0 rgba(110,80,30,.25), .05em .07em 0 #c9b27a, .06em .1em .12em rgba(0,0,0,.45);
        display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tl b { font-weight: 900; font-size: .64em; margin-top: -.03em; letter-spacing: -.03em; }
  .tl i { display: block; width: .42em; height: .42em; font-style: normal; }
  .tl i svg { width: 100%; height: 100%; display: block; }
  .tl.m b, .tl.m i { color: #c42020; } .tl.p b { color: #1a55b8; } .tl.s b { color: #137a36; }
  .tl.m i { width: auto; height: auto; font-size: .4em; font-weight: 800; }
  .tl.w b { color: #1d2c57; font-size: .6em; } .tl.w small { font-size: .3em; font-weight: 800; color: #1d2c57; opacity: .8; margin-top: .05em; }
  .tl.d b { font-size: .74em; font-weight: 800; } .tl.dR b { color: #d02222; } .tl.dG b { color: #127a36; }
  .tl.dW i { width: .6em; height: .72em; }
  .tl.f em { font-style: normal; font-size: .56em; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .tl.f small { font-size: .28em; font-weight: 800; color: #8a3b5c; }
  .tl.inl { display: inline-flex; vertical-align: middle; margin: 1px; }
  .tl.back { background: linear-gradient(155deg, #3fae79, #1f7a50 70%, #17603f); box-shadow: inset 0 0 0 .06em #a8e2c2, .05em .07em 0 #e9dfc3, .06em .1em .12em rgba(0,0,0,.45); }
  .tl.last { box-shadow: 0 0 0 .1em #ffcf33, 0 0 .35em .08em rgba(255,200,40,.95); animation: pulse 1s ease-in-out infinite alternate; z-index: 2; }
  @keyframes pulse { to { box-shadow: 0 0 0 .1em #ffcf33, 0 0 .1em rgba(255,200,40,.4); } }
  .tl.win { box-shadow: 0 0 0 .09em #ff5a3c, 0 0 .3em .05em rgba(255,90,60,.9); }
  .tl.claimed { filter: brightness(.9) sepia(.25); }

  /* ---------------- game layout (portrait default) ---------------- */
  #game { display: grid; grid-template-columns: 100%;
          grid-template-rows: auto auto minmax(0,1fr) auto auto auto auto;
          grid-template-areas: "topbar" "optop" "mid" "hints" "me" "hand" "actions";

  const shuffle = (a, rng) => { for (let i = a.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- TILES ----------
     Tile TYPE 0..33:  0-8 Characters 1-9 | 9-17 Dots 1-9 | 18-26 Bamboo 1-9
                       27-30 East South West North winds | 31-33 White Green Red dragons
                       34-41 optional bonus tiles (4 flowers, 4 seasons)
     Physical tile ID: 0..135 (4 copies: type = id>>2), bonus 136..143.        */
  // (ids >= 200 belong to the American set: 200-207 flowers -> 42, 208-215 jokers -> 43, 216+ blanks -> 44)
  const typeOf = id => (id < 136 ? id >> 2 : id < 200 ? 34 + id - 136 : id < 208 ? 42 : id < 216 ? 43 : 44);
  const isSuit = t => t < 27, suitOf = t => (t / 9) | 0, rankOf = t => (t % 9) + 1;
  const isHonor = t => t >= 27 && t < 34, isWind = t => t >= 27 && t < 31, isDragon = t => t >= 31 && t < 34;
  const isTerminal = t => t < 27 && (t % 9 === 0 || t % 9 === 8), isBonus = t => t >= 34;
  const SUITS = ['Characters', 'Dots', 'Bamboo'], WINDS = ['East', 'South', 'West', 'North'], DRAGONS = ['White', 'Green', 'Red'];
  function tileName(t) {
    if (t < 27) return `${rankOf(t)} ${SUITS[suitOf(t)]}`;
    if (t < 31) return WINDS[t - 27] + ' Wind';
    if (t < 34) return DRAGONS[t - 31] + ' Dragon';

  /* ---------- SHANTEN ("tiles away from ready"; -1 = complete hand) ----------
     Standard form: shanten = 8 - 2*melds - partials - pair, where partials
     (pairs / two-tile sequences) are capped at 4 - melds. Exposed melds count
     as melds. Each suit (9 counts, base-5 key) is decomposed exhaustively ONCE
     and memoised as a Pareto set of (melds, partials, pair) triples; honours
     are trivial; the parts are then combined. Fast enough for thousands of
     AI evaluations per hand.
     Seven pairs: 6 - pairs + max(0, 7 - distinct kinds)  (concealed only).   */
  const suitMemo = new Map();
  function pareto(list) {
    const out = [];
    list.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
    for (const x of list) {

  function suitRec(a) {
    let key = 0; for (let i = 0; i < 9; i++) key = key * 5 + a[i];
    const hit = suitMemo.get(key); if (hit) return hit;
    let i = 0; while (i < 9 && !a[i]) i++;
    if (i === 9) { const b = [[0, 0, 0]]; suitMemo.set(key, b); return b; }
    const out = [];
    const add = (sets, dm, dt, dp) => { for (const s of sets) if (s[2] + dp <= 1) out.push([s[0] + dm, s[1] + dt, s[2] + dp]); };
    a[i]--; add(suitRec(a), 0, 0, 0); a[i]++;                                   // leave tile isolated
    if (a[i] >= 3) { a[i] -= 3; add(suitRec(a), 1, 0, 0); a[i] += 3; }          // pung
    if (a[i] >= 2) { a[i] -= 2; const r = suitRec(a); add(r, 0, 1, 0); add(r, 0, 0, 1); a[i] += 2; } // pair: partial or head
    if (i <= 6 && a[i + 1] && a[i + 2]) { a[i]--; a[i + 1]--; a[i + 2]--; add(suitRec(a), 1, 0, 0); a[i]++; a[i + 1]++; a[i + 2]++; } // chow
    if (i <= 7 && a[i + 1]) { a[i]--; a[i + 1]--; add(suitRec(a), 0, 1, 0); a[i]++; a[i + 1]++; }   // 2-sided / edge partial
    if (i <= 6 && a[i + 2]) { a[i]--; a[i + 2]--; add(suitRec(a), 0, 1, 0); a[i]++; a[i + 2]++; }   // closed partial

  /* ---------- SCORING ----------
     Points ("fan") per winning hand; the best interpretation is used.
     Hand value = min(fan, FAN_LIMIT) x POINT_UNIT.                           */
  const FAN_TABLE = [

    ['Concealed hand', 1, 'No claimed melds (concealed kongs are fine)'],
    ['All chows', 1, 'Four chows + pair'],
    ['All pungs', 3, 'Four pungs/kongs + pair'],
    ['Seven pairs', 4, 'Seven different pairs (concealed)'],
    ['Half flush', 3, 'One suit plus honours'],
    ['Full flush', 6, 'One suit only'],
    ['All honours', 8, 'Only winds and dragons'],
    ['Dragon pung', 1, 'Each pung/kong of dragons'],
    ['Seat wind pung', 1, 'Pung/kong of your own seat wind'],
    ['Round wind pung', 1, 'Pung/kong of the prevailing wind'],
    ['Win after kong', 1, 'Won on a kong replacement tile'],

    ['Flower', 1, 'Each bonus tile (only if flowers enabled)'],

  const FAN = Object.fromEntries(FAN_TABLE.map(r => [r[0], r[1]]));
  /* o: { c: concealed counts incl. winning tile, melds, selfDrawn, seatWind,

  function scoreHand(o) {
    const exposed = o.melds.length;
    const allTypes = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < o.c[t]; k++) allTypes.push(t);
    for (const m of o.melds) for (let k = 0; k < 3; k++) allTypes.push(m.kind === 'chow' ? m.t + k : m.t);
    const suits = new Set(allTypes.filter(isSuit).map(suitOf)), honors = allTypes.some(isHonor);
    const common = [];
    common.push(['Win', FAN.Win]);
    if (o.selfDrawn) common.push(['Self-drawn', FAN['Self-drawn']]);
    if (o.melds.every(m => m.concealed)) common.push(['Concealed hand', FAN['Concealed hand']]);
    if (suits.size === 0) common.push(['All honours', FAN['All honours']]);
    else if (suits.size === 1 && !honors) common.push(['Full flush', FAN['Full flush']]);
    else if (suits.size === 1) common.push(['Half flush', FAN['Half flush']]);
    if (o.afterKong) common.push(['Win after kong', FAN['Win after kong']]);
    if (o.lastTile) common.push(['Last tile', FAN['Last tile']]);
    for (let k = 0; k < (o.flowers || 0); k++) common.push(['Flower', FAN.Flower]);
    const cands = [];
    const c = o.c.slice();
    for (const d of decompose(c)) {
      const all = o.melds.map(m => ({ kind: m.kind === 'chow' ? 'chow' : 'pung', t: m.t })).concat(d.melds);
      if (all.length !== 4) continue;
      const items = common.slice();
      if (all.every(m => m.kind === 'pung')) items.push(['All pungs', FAN['All pungs']]);
      if (all.every(m => m.kind === 'chow')) items.push(['All chows', FAN['All chows']]);
      for (const m of all) if (m.kind === 'pung') {
        if (isDragon(m.t)) items.push(['Dragon pung', FAN['Dragon pung']]);
        if (m.t === 27 + o.seatWind) items.push(['Seat wind pung', FAN['Seat wind pung']]);
        if (m.t === 27 + o.roundWind) items.push(['Round wind pung', FAN['Round wind pung']]);
      }
      cands.push({ items, form: 'standard', decomposition: d });
    }
    if (SEVEN_PAIRS && isSevenPairs(o.c, exposed)) cands.push({ items: common.concat([['Seven pairs', FAN['Seven pairs']]]), form: 'seven pairs' });
    if (!cands.length) return null;
    for (const k of cands) k.raw = k.items.reduce((s, x) => s + x[1], 0);
    cands.sort((a, b) => b.raw - a.raw);
    const best = cands[0], limit = o.fanLimit || 10;
    best.fan = Math.min(best.raw, limit); best.limited = best.raw > limit;
    best.value = best.fan * (o.pointUnit || 10);

  }

  /* ---------- GAME STATE MACHINE ----------
     Seats 0..3, turn order 0 -> 1 -> 2 -> 3 (seat 0 = human, bottom; 1 = right;
     2 = top; 3 = left). Phases:
       'discard' : players[current] must act (discard / self-drawn win / kong)
       'claim'   : a discard is on the table; eligible players respond
       'end'     : hand finished (result set) -> nextHand()

  class Game {

      setSevenPairs(this.cfg.sevenPairs);

    }
    get roundWind() { return Math.min(this.cfg.length === 'full' ? 1 : 0, (this.rotations / 4) | 0); }   // East (0), South (1) in East+South games
    get handNo() { return this.handsPlayed + (this.phase === 'end' || this.phase === 'over' ? 0 : 1); }
    get maxHands() { return { quick: 4, east: 12, full: 24 }[this.cfg.length] || 4; }
    seatWind(s) { return (s - this.dealer + 4) % 4; }
    live() { return this.wall.length - this.cfg.deadWall; }
    note(msg) { this.log.push(msg); if (this.log.length > 200) this.log.shift(); }

    /* opts.rig = { seat: [types] } (debug/tests): that seat is dealt these types
       (dealer may get 14 = 13 + first draw). opts.rigDraws = [types] to put on top of the wall. */
    startHand(opts = {}) {
      const n = this.cfg.flowers ? 144 : 136;
      const wall = shuffle([...Array(n).keys()], this.rng);
      const take = t => { const i = wall.findIndex(id => typeOf(id) === t); if (i < 0) throw new Error('rig: no tile ' + t); return wall.splice(i, 1)[0]; };
      const rigged = {};
      for (const s in (opts.rig || {})) rigged[s] = opts.rig[s].map(take);
      const draws = (opts.rigDraws || []).map(take);
      for (const p of this.players) { p.hand = []; p.melds = []; p.pond = []; p.history = []; p.flowers = []; }

      this.lastDraw = null; this.justDrew = false; this.current = this.dealer; this.phase = 'discard';
      if (this.cfg.flowers) for (let k = 0; k < 4; k++) {   // replace bonus tiles dealt
        const p = this.players[(this.dealer + k) % 4];
        for (let i = p.hand.length - 1; i >= 0; i--) if (isBonus(typeOf(p.hand[i]))) {

    draw(seat, fromBack = false, silent = false) {

        if (fromBack && this.wall.length === 0) return null;
        const id = fromBack ? this.wall.pop() : this.wall.shift();
        if (isBonus(typeOf(id))) { p.flowers.push(id); fromBack = true; continue; }

        if (this.wall.length > 0) {

          for (const m of p.melds) if (m.kind === 'pung' && c[m.t] >= 1) o.kongs.push({ t: m.t, kind: 'added' });

      const out = [];
      for (let k = 0; k < n; k++) {

        out.push(p.hand.splice(i, 1)[0]);

    }
    /* Turn action: {type:'discard', id} | {type:'tsumo'} | {type:'kong', t} */
    act(seat, a) {
      const o = this.turnOptions(seat);
      if (!o) throw new Error(`seat ${seat} cannot act in phase ${this.phase}`);
      const p = this.players[seat];
      if (a.type === 'tsumo') { if (!o.tsumo) throw new Error('no win'); return this.win(seat, null); }
      if (a.type === 'kong') {
        const k = o.kongs.find(k => k.t === a.t); if (!k) throw new Error('illegal kong');
        if (k.kind === 'concealed') p.melds.push({ kind: 'kong', t: a.t, tiles: this.takeType(p, a.t, 4), concealed: true, from: seat });
        else { const m = p.melds.find(m => m.kind === 'pung' && m.t === a.t); m.tiles.push(...this.takeType(p, a.t, 1)); m.kind = 'kong'; m.added = true; }

      const o = { win, pung: false, kong: false, chows: [] };
      if (this.live() > 0) {             // on the very last discard only a win may be claimed

        if (s === (d.seat + 1) % 4 && t < 27) {           // chow: next player only

    /* Claim response: {type:'pass'|'win'|'pung'|'kong'|'chow', with:[a,b]} */
    respond(s, r) {
      if (this.phase !== 'claim') throw new Error('no claim pending');
      const o = this.claim.options[s]; if (!o) throw new Error('seat not eligible');
      if (s in this.claim.responses) throw new Error('already responded');
      const ok = r.type === 'pass' || (r.type === 'win' && o.win) || (r.type === 'pung' && o.pung) || (r.type === 'kong' && o.kong) ||
        (r.type === 'chow' && o.chows.some(ch => r.with && ch[0] === r.with[0] && ch[1] === r.with[1]));
      if (!ok) throw new Error('illegal claim ' + JSON.stringify(r));
      this.claim.responses[s] = r;
      if (Object.keys(this.claim.responses).length === Object.keys(this.claim.options).length) this.resolveClaims();

    /* Priority: WIN > PUNG/KONG > CHOW. Several winners -> first in turn order after the discarder (single winner). */
    resolveClaims() {
      const d = this.lastDiscard, R = this.claim.responses;
      const order = [1, 2, 3].map(k => (d.seat + k) % 4).filter(s => s in R);
      const w = order.find(s => R[s].type === 'win');
      if (w != null) return this.win(w, d.seat);
      const pk = order.find(s => R[s].type === 'pung' || R[s].type === 'kong');
      if (pk != null) return this.makeMeld(pk, R[pk]);
      const ch = order.find(s => R[s].type === 'chow');
      if (ch != null) return this.makeMeld(ch, R[ch]);
      return this.next();
    }
    makeMeld(s, r) {
      const d = this.lastDiscard, t = typeOf(d.id), p = this.players[s], from = this.players[d.seat];
      from.pond.pop();                                       // claimed tile leaves the pond
      let meld;
      if (r.type === 'chow') {
        const ids = [...this.takeType(p, r.with[0], 1), ...this.takeType(p, r.with[1], 1), d.id];
        meld = { kind: 'chow', t: Math.min(t, r.with[0]), tiles: sortIds(ids), from: d.seat, claimed: d.id };
      } else {
        meld = { kind: r.type, t, tiles: [...this.takeType(p, t, r.type === 'kong' ? 3 : 2), d.id], from: d.seat, claimed: d.id };
      }
      p.melds.push(meld);
      this.note(`${p.name} claims ${r.type} (${tileName(t)}) from ${from.name}`);
      this.current = s; this.phase = 'discard'; this.claim = null; this.justDrew = false; this.lastDraw = null; this.lastClaim = { seat: s, kind: r.type };
      if (r.type === 'kong') {

        this.afterKong = true;
      }
    }
    next() {

  const isHumanTurn = () => g && g.phase === 'discard' && g.current === 0 && !autoHuman;
  const humanClaim = () => g && g.phase === 'claim' && g.claim.options[0] && !(0 in g.claim.responses);

  /* ---------- rendering ---------- */
  function oppHTML(s, where) {
    const p = g.players[s], w = g.seatWind(s), lvl = S.levels[s];
    const info = `<div class="oinfo"><div class="nm">${p.name}${g.dealer === s ? '<span class="dealer">D</span>' : ''}</div>
      <div class="tags"><span class="wind cjk w${w}">${WCH[w]}</span><span class="lvl ${lvl}">${LV[lvl]}</span></div><div class="sc">${p.score}</div></div>`;
    let hand;
    if (S.revealAI || (g.phase === 'end' && g.result && g.result.type === 'draw')) hand = `<div class="ohand rev">${sortIds(p.hand).map(id => tile(id)).join('')}</div>`;
    else if (where === 'top') hand = `<div class="ohand">${p.hand.map(() => back()).join('')}</div>`;
    else hand = `<div class="ohand">${back()}<span>×${p.hand.length}</span></div>`;
    const fl = p.flowers.length ? `<div class="flw">🌸×${p.flowers.length}</div>` : '';
    return info + hand + `<div class="omelds">${p.melds.map(m => meldHTML(m, false)).join('')}</div>` + fl;
  }
  function render() {
    if (!g) return;
    const ld = g.lastDiscard;
    $('tbInfo').innerHTML = AMmode() ? `<span class="cjk">🇺🇸</span> American · Hand ${Math.max(1, g.handNo)}/${g.maxHands}` : `<span class="cjk">${WCH[g.roundWind]}</span> ${WNAME[g.roundWind]} round · Hand ${Math.max(1, g.handNo)}${g.cfg.length === 'quick' ? '/4' : ''}`;
    const panes = { 1: $('opRight'), 2: $('opTop'), 3: $('opLeft') };
    for (const s of [1, 2, 3]) {
      panes[s].innerHTML = oppHTML(s, s === 2 ? 'top' : 'side');
      panes[s].classList.toggle('active', g.current === s && (g.phase === 'discard'));
    }
    for (let s = 0; s < 4; s++) {
      const p = g.players[s], el = $('pond' + s);
      el.innerHTML = p.pond.map((id, k) => tile(id, ld && ld.id === id && ld.seat === s && k === p.pond.length - 1 ? 'last' : '')).join('');
      el.classList.toggle('active', g.current === s && g.phase === 'discard');
    }
    const arrow = ['▼', '▶', '▲', '◀'][g.current];
    const who = g.current === 0 ? 'Your turn' : g.players[g.current].name;
    $('center').innerHTML = (AMmode() && centerAM()) || `<div class="rw cjk">${AMmode() ? '🀄' : WCH[g.roundWind]}</div><div class="wl">Wall <b>${Math.max(0, g.live())}</b></div>
      <div class="arrow">${g.phase === 'claim' ? '⏳' : arrow}</div><div class="turn">${g.phase === 'claim' ? (AMmode() ? 'Calls…' : 'Claims…') : who}</div>`;
    // me
    const me = g.players[0], w0 = g.seatWind(0);
    let help = '';
    if (AMmode()) help = g.phase === 'end' ? '' : helpLineAM();
    else if (g.phase === 'discard' || g.phase === 'claim') {
      const c = counts(me.hand), ex = me.melds.length;
      let sh;
      if (me.hand.length % 3 === 2) { sh = 99; for (let t = 0; t < 34; t++) if (c[t]) { c[t]--; sh = Math.min(sh, shanten(c, ex)); c[t]++; } }
      else sh = shanten(c, ex);
      if (sh === -1) help = '<b>Mahjong! Tap Win</b>';
      else if (sh === 0 && me.hand.length % 3 === 1) {
        const waits = ukeire(c, ex, new Array(34).fill(4)).tiles;
        help = `Ready! waits: ${waits.slice(0, 6).map(t => tileT(t)).join('')}${waits.length > 6 ? '…' : ''}`;
      } else if (sh === 0) help = 'Ready after this discard';
      else help = `${sh} away from ready`;
    }
    const prompt = AMmode() ? promptAM() : (g.phase === 'end' ? '' : humanClaim() ? 'Take the discard, or Pass' : isHumanTurn() ? (sel == null ? 'Your turn: tap a tile to discard' : 'Tap it again (or Discard) to throw it') : g.phase === 'claim' ? 'Waiting for claims…' : `${g.players[g.current].name} is playing…`);
    $('meInfo').innerHTML = `<span class="meTag"><span class="nm">${me.name}${g.dealer === 0 ? '<span class="dealer">D</span>' : ''}</span>
      ${AMmode() ? '' : `<span class="wind cjk w${w0}">${WCH[w0]}</span>`}<span class="sc">${me.score}</span>${me.flowers.length ? `<span class="flw">🌸×${me.flowers.length}</span>` : ''}</span><span class="prompt${isHumanTurn() || humanClaim() || (AMmode() && g.phase === 'charleston') ? ' me' : ''}">${prompt}</span>${AMmode() || !help ? '' : `<span class="help">${help}</span>`}`;
    $('meInfo').classList.toggle('active', g.current === 0 && g.phase === 'discard');
    // hand
    const drawn = g.current === 0 && g.phase === 'discard' && g.justDrew ? g.lastDraw : null;
    const conc = sortIds(me.hand.filter(id => id !== drawn));
    const hand = $('hand');
    hand.classList.toggle('myturn', isHumanTurn());
    hand.innerHTML = (me.melds.length ? `<div class="mymelds">${me.melds.map(m => meldHTML(m, true)).join('')}</div>` : '') +
      `<div class="conc">${conc.map(id => tile(id, handCls(id))).join('')}${drawn != null ? '<span class="gap"></span><span class="drawnWrap"><small>NEW</small>' + tile(drawn, 'drawn ' + handCls(drawn)) + '</span>' : ''}</div>`;
    hand.classList.toggle('picking', AMmode() && g.phase === 'charleston');
    renderHints();
    renderActions();
    fit();
  }
  function handCls(id) {
    let c = '';
    if (AMmode() && g.phase === 'charleston') { if (chSel.includes(id)) c += ' sel'; if (chNew.includes(id)) c += ' new'; }
    else if (id === sel) c += ' sel';
    const ks = keepSet(); if (ks) c += ks.has(id) ? ' keep' : ' spare';
    return c;
  }
  function renderActions() {
    if (AMmode()) return renderActionsAM();
    const A = $('actions');
    if (humanClaim()) {
      const o = g.claim.options[0], t = typeOf(g.lastDiscard.id), from = g.players[g.lastDiscard.seat].name;
      let b = '';
      if (o.win) b += '<button class="win" data-act="claim:win">Win!</button>';
      if (o.kong) b += '<button class="go" data-act="claim:kong">Kong</button>';
      if (o.pung) b += '<button class="go" data-act="claim:pung">Pung</button>';
      for (const ch of o.chows) {
        const tiles = [ch[0], ch[1], t].sort((a, c) => a - c).map(x => tileT(x)).join('');
        b += `<button class="go chow" data-act="claim:chow:${ch[0]},${ch[1]}"><span class="row">${tiles}</span>Chow</button>`;
      }
      b += '<button data-act="claim:pass">Pass</button>';
      A.innerHTML = `<div class="claimq">${tileT(t)} <span>${from} discarded ${tileName(t)}</span></div><div class="abtns">${b}</div>`;
      return;
    }
    if (isHumanTurn()) {
      const o = g.turnOptions(0);
      if (kongPick) {
        A.innerHTML = `<div class="abtns">${o.kongs.map(k => `<button class="go chow" data-act="kong:${k.t}"><span class="row">${tileT(k.t).repeat(4)}</span>${k.kind === 'added' ? 'Add' : 'Kong'}</button>`).join('')}<button data-act="cancel">Back</button></div>`;
        return;
      }
      let b = '';
      if (o.tsumo) b += '<button class="win" data-act="tsumo">Win!</button>';
      if (o.kongs.length) b += `<button class="go" data-act="kongmenu">Kong</button>`;
      b += `<button data-act="discard" ${sel == null ? 'disabled' : ''}>Discard</button>`;
      A.innerHTML = `<div class="abtns">${b}</div><div class="hint">${sel == null ? 'Tap a tile to select it, tap again to discard' : 'Tap the tile again (or Discard) to throw ' + tileName(typeOf(sel))}</div>`;
      return;
    }
    let msg = '';
    if (g.phase === 'discard') msg = g.current === 0 ? 'Auto-playing for you…' : `${g.players[g.current].name} is thinking…`;
    else if (g.phase === 'claim') msg = 'Waiting for claims…';
    A.innerHTML = `<div class="status">${msg}</div>`;
  }

  /* Responsive sizing: hand tiles, ponds, meld tiles. */
  /* UI scale --k: 1 on phones; tablets / big windows get proportionally larger
     text, buttons and tiles (every CSS px value >= 3 is multiplied by --k). */
  const LAND_MQ = '(orientation: landscape) and (min-aspect-ratio: 13/10)';
  let K = 1;
  function setScale() {
    const land = matchMedia(LAND_MQ).matches, vw = innerWidth, vh = innerHeight;
    K = Math.max(1, Math.min(1.75, land ? Math.min(vw / 844, vh / 390) : Math.min(vw / 390, vh / 780)));
    K = Math.round(K * 100) / 100;
    document.documentElement.style.setProperty('--k', K);
  }
  setScale();
  addEventListener('resize', setScale);
  function fit() {
    setScale();
    const land = matchMedia(LAND_MQ).matches;
    const vw = innerWidth;
    $('game').style.setProperty('--rcol', (land && AMmode() && S.hints ? Math.round(Math.min(vw * 0.34, 250 * K)) : Math.round(168 * K)) + 'px');
    if (AMmode()) { const hw0 = $('hints').clientWidth || innerWidth; const cw = land ? Math.min(20 * K, (hw0 - 30) / 17) : Math.min(22 * K, (hw0 - 120 * K) / 15.5); $('hints').style.setProperty('--cw', Math.max(11, Math.floor(cw)) + 'px'); }
    const sidew = land ? Math.min(110 * K, Math.max(80 * K, vw * 0.11)) : Math.min(84 * K, Math.max(60, vw * 0.165));
    $('mid').style.setProperty('--sidew', sidew + 'px');
    // opponent meld tiles
    if (land) for (const id of ['opLeft', 'opRight']) $(id).style.setProperty('--mw', Math.floor(Math.min(18 * K, (sidew - 10) / 4)) + 'px');
    $('opTop').style.setProperty('--mw', Math.floor((land ? 16 : 17) * K) + 'px');
    // human hand: n concealed tiles + meld tiles at 72% size must fit the row
    const me = g.players[0], hand = $('hand');
    const W = hand.clientWidth - 10;
    const n = me.hand.length, mt = me.melds.reduce((a, m) => a + m.tiles.length, 0);
    const gaps = n * 2 + 10 * K + me.melds.length * 4 * K + (me.melds.length ? 6 * K : 0);
    let hw = (W - gaps) / (n + 0.72 * mt);
    hw = Math.min(hw, (land ? 58 : 56) * K);
    if (land) hw = Math.min(hw, (innerHeight * 0.165) / 1.34);
    hw = Math.max(18, Math.floor(hw));
    hand.style.setProperty('--hw', hw + 'px');
    hand.style.setProperty('--mw', Math.floor(hw * 0.72) + 'px');
    // move the side opponents: portrait -> table corners, landscape -> own columns
    const tb = $('table'), mid = $('mid'), oL = $('opLeft'), oR = $('opRight');
    if (land && oL.parentNode !== mid) { mid.insertBefore(oL, tb); mid.appendChild(oR); }
    if (!land && oL.parentNode !== tb) { tb.appendChild(oL); tb.appendChild(oR); }
    // table: choose pond columns + tile size that fit (each pond sized for >= 20 tiles)
    const TW = tb.clientWidth - 8, TH = tb.clientHeight - 8;
    const cap = Math.max(15, ...g.players.map(p => p.pond.length));
    const minSide = land ? 0 : 72 * K;
    const panelH = land ? 0 : Math.max(oL.scrollHeight, oR.scrollHeight, 100);
    let best = null;
    for (let tc = 4; tc <= 12; tc++) for (let sc = 2; sc <= 6; sc++) {
      const tr = Math.ceil(cap / tc), sr = Math.ceil(cap / sc);
      for (let pw = Math.round(34 * K); pw >= 12; pw -= 0.5) {
        if (best && pw <= best.pw) break;
        const cw = pw + 2, ph = pw * 1.34 + 2, side = Math.max(sc * cw + 4, minSide);
        if (2 * side + tc * cw + 12 > TW || tc * cw < 70) continue;
        if (Math.max(tr * ph, panelH) + sr * ph + tr * ph + 16 > TH) continue;
        best = { tc, sc, tr, pw, side };
        break;
      }
    }
    if (best) {
      const pw = Math.floor(best.pw);
      tb.style.setProperty('--pw', pw + 'px');
      tb.style.setProperty('--tc', best.tc); tb.style.setProperty('--sc', best.sc); tb.style.setProperty('--tr', best.tr);
      const side = Math.max(best.sc * (pw + 2) + 4, minSide);
      tb.style.gridTemplateColumns = `${side}px ${best.tc * (pw + 2)}px ${side}px`;
      if (!land) for (const el of [oL, oR]) el.style.setProperty('--mw', Math.floor(Math.min(17 * K, (side - 12) / 4)) + 'px');
    }
  }

  /* ---------- callouts (PUNG! / KONG! / WIN!) from the engine log ---------- */
  let calloutT;
  function callout(text) {
    const c = $('callout'); c.textContent = text; c.classList.add('show');
    clearTimeout(calloutT); calloutT = setTimeout(() => c.classList.remove('show'), Math.max(500, S.SPEED_MS[S.speed] * 1.2));
  }
  function scanLog() {
    for (; logSeen < g.log.length; logSeen++) {
      const m = g.log[logSeen];
      const mm = m.match(/^(.*) claims (\w+)/); if (mm) callout(`${mm[1]}: ${mm[2].toUpperCase()}!`);
      const k = m.match(/^(.*): (concealed|added) kong/); if (k) callout(`${k[1]}: KONG!`);
    }
  }

  /* ---------- 6. game loop ---------- */
  const delay = () => S.SPEED_MS[S.speed] ?? 600;
  function schedule(ms = delay()) { clearTimeout(timer); timer = setTimeout(step, ms); }
  let menuOpen = false;
  const paused = () => menuOpen || !$('cardView').hidden || !$('help').hidden;
  function step() {
    if (!g) return;
    if (paused()) { clearTimeout(timer); timer = setTimeout(step, 250); return; }
    try {
      if (g.phase === 'end') return showResult();
      if (g.phase === 'over') return showFinal();
      if (AMmode()) return stepAM();
      if (g.phase === 'discard') {
        if (isHumanTurn()) { render(); return; }            // wait for taps
        g.act(g.current, MJAI.chooseTurn(g, g.current, levelOf(g.current), rng));
        return after();
      }
      if (g.phase === 'claim') {
        for (const k in g.claim.options) {                    // AIs decide silently
          const s = +k; if (s === 0 || k in g.claim.responses) continue;
          g.respond(s, MJAI.chooseClaim(g, s, g.claim.options[k], levelOf(s), rng));
          if (g.phase !== 'claim') return after();
        }
        if (humanClaim()) {
          const o = g.claim.options[0];
          if (autoHuman) g.respond(0, MJAI.chooseClaim(g, 0, o, 'medium', rng));
          else if (S.autoPass && !o.win) g.respond(0, { type: 'pass' });
          else { render(); return; }                          // show claim prompt
        }
        return after();
      }
    } catch (e) { console.error(e); }
  }
  function after(ms) {
    sel = null; kongPick = false;
    scanLog(); render();
    if (g.phase === 'end') { if (g.result.type === 'win') callout(g.result.seat === 0 ? (S.THEME === 'koi' ? 'MAHJONG! 🐟' : 'MAHJONG!') : `${g.players[g.result.seat].name}: MAHJONG!`); schedule(Math.max(600, delay())); return; }
    schedule(ms);
  }

  /* ---------- 5. input ---------- */
  function onHandTap(id) {
    if (AMmode()) return onHandTapAM(id);
    if (!isHumanTurn() || kongPick) return;
    if (sel === id) { humanDiscard(id); return; }
    sel = id; render();
  }
  function humanDiscard(id) {
    if (!isHumanTurn()) return;
    g.act(0, { type: 'discard', id }); after();
  }
  function onAction(act) {
    if (AMmode()) return onActionAM(act);
    if (act === 'discard' && sel != null) return humanDiscard(sel);
    if (act === 'tsumo' && isHumanTurn()) { g.act(0, { type: 'tsumo' }); return after(); }
    if (act === 'kongmenu') {
      const o = g.turnOptions(0);
      if (o.kongs.length === 1) { g.act(0, { type: 'kong', t: o.kongs[0].t }); return after(); }
      kongPick = true; return render();
    }
    if (act.startsWith('kong:')) { g.act(0, { type: 'kong', t: +act.slice(5) }); return after(); }
    if (act === 'cancel') { kongPick = false; return render(); }
    if (act.startsWith('claim:') && humanClaim()) {
      const [, type, w] = act.split(':');
      g.respond(0, type === 'chow' ? { type, with: w.split(',').map(Number) } : { type });
      return after(120);
    }
  }
  $('hand').addEventListener('click', e => { const t = e.target.closest('.conc .tl'); if (t) onHandTap(+t.dataset.id); });
  $('actions').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b && !b.disabled) onAction(b.dataset.act); });
  $('bHelp').onclick = showHelp;
  /* One menu for the rarely used controls (keeps the play screen calm). The game pauses while it is open. */
  function showMenu() {
    if (!g || !$('overlay').hidden) return;
    menuOpen = true; const am = AMmode();
    const close = () => { menuOpen = false; $('overlay').hidden = true; $('overlay').onclick = null; if (g) { render(); schedule(250); } };
    openCard(`<h2>Menu</h2><p class="sub">The game is paused.</p><div class="menuList">
      <button class="go" data-m="resume">▶ Back to game</button>
      <button data-m="help">❓ How to play</button>
      ${am ? `<button data-m="card">📋 Full card</button><button data-m="hints">${S.hints ? '🙈 Hide' : '💡 Show'} top 5 hands</button>` : ''}
      <button data-m="eye">${S.revealAI ? '🙈 Hide' : '👁 Show'} computer players' tiles<small>For learning</small></button>
      <button data-m="restart">↻ Restart this hand</button>
      <button data-m="new">🏠 New game &amp; settings<small>Players, rules, tiles, speed</small></button></div>`, c => {
      c.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
        const m = b.dataset.m; close();
        if (m === 'help') showHelp();
        else if (m === 'card') showCardView();
        else if (m === 'hints') { S.hints = !S.hints; save(); render(); }
        else if (m === 'eye') { S.revealAI = !S.revealAI; save(); render(); }
        else if (m === 'restart') { if (g.phase !== 'over') confirmBox('Restart this hand?', 'The hand is re-dealt; scores stay as they were before it.', () => { clearTimeout(timer); $('overlay').hidden = true; g.restartHand(); logSeen = g.log.length; after(400); }); }
        else if (m === 'new') confirmBox('Leave this game?', 'Back to the start screen. The current match is lost.', () => { clearTimeout(timer); g = null; $('overlay').hidden = true; showSetup(); });
      });
    });
    $('overlay').onclick = e => { if (e.target.id === 'overlay' && menuOpen) close(); };
  }
  $('bMenu').onclick = showMenu;
  addEventListener('resize', () => { if (g) requestAnimationFrame(render); });
  addEventListener('orientationchange', () => setTimeout(() => g && render(), 200));
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ---------- overlays ---------- */
  function openCard(html, bind) { $('card').innerHTML = html; $('overlay').hidden = false; $('card').scrollTop = 0; if (bind) bind($('card')); }
  function confirmBox(title, text, yes) {
    openCard(`<h2>${title}</h2><p class="sub">${text}</p><div class="ovb"><button data-k="no">Cancel</button><button class="go" data-k="yes">OK</button></div>`, c => {
      c.querySelector('[data-k=no]').onclick = () => { $('overlay').hidden = true; };
      c.querySelector('[data-k=yes]').onclick = yes;
    });
  }
  function scoreTable() {
    return `<table class="bd">${g.players.map((p, s) => {
      const d = g.result.payments[s];
      return `<tr><td>${p.name}${g.result.dealer === s ? ' <span class="dealer">D</span>' : ''}</td><td class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${d || '±0'}</td><td>${p.score}</td></tr>`;
    }).join('')}</table>`;
  }
  function showResult() {
    if (AMmode()) return showResultAM();
    const r = g.result; render();
    let html;
    if (r.type === 'draw') {
      html = `<h2>Draw game</h2><p class="sub">The wall is exhausted; nobody won. ${g.players[r.dealer].name} keeps the deal.</p>${scoreTable()}`;
    } else {
      const p = g.players[r.seat], sc = r.score;
      const how = r.selfDrawn ? 'Self-drawn (everyone pays)' : `On ${g.players[r.from].name}'s discard (${g.players[r.from].name} pays double)`;
      let winMarked = false;
      const conc = r.hand.map(id => { if (!winMarked && id === r.winTile) { winMarked = true; return tile(id, 'win'); } return tile(id); }).join('');
      const melds = r.melds.map(m => `<div class="grp">${m.tiles.map(id => tile(id, id === m.claimed ? 'claimed' : '')).join('')}</div>`).join('');
      html = `<h2>${r.seat === 0 ? `${p.name} wins! ${S.THEME === 'koi' ? '🐟' : '🎉'}` : p.name + ' wins' + (S.THEME === 'koi' ? ' 🐠' : '')}</h2><p class="sub">${how}${sc.form === 'seven pairs' ? ' · Seven pairs' : ''}</p>
        <div class="whand">${melds}<div class="grp">${conc}</div></div>
        <table class="bd">${sc.items.map(i => `<tr><td>${i[0]}</td><td>+${i[1]}</td></tr>`).join('')}
        <tr class="tot"><td>Total${sc.limited ? ' (limit)' : ''}: ${sc.fan} fan × ${g.cfg.pointUnit}</td><td>${sc.value} pts</td></tr></table>
        <h3 style="margin:12px 0 4px;font-size:15px">Payments</h3>${scoreTable()}`;
    }
    openCard(html + `<div class="ovb"><button class="go" data-k="next">${willEnd() ? 'Final results' : 'Next hand'}</button></div>`, c => {
      c.querySelector('[data-k=next]').onclick = () => { $('overlay').hidden = true; g.nextHand(rigNext ? { rig: rigNext } : undefined); rigNext = null; logSeen = g.log.length; after(400); };
    });
  }
  function willEnd() {   // would nextHand() end the match?
    if (AMmode()) return g.handsPlayed + 1 >= g.maxHands;
    const r = g.result, rot = g.rotations + (r.type === 'win' && r.seat !== g.dealer ? 1 : 0);
    if (g.cfg.length === 'quick') return g.handsPlayed >= 4;
    return rot >= (g.cfg.length === 'full' ? 8 : 4) || g.handsPlayed >= g.maxHands;
  }
  function showFinal() {
    const rk = g.ranking(), medals = ['🥇', '🥈', '🥉', '<small style="font-size:15px;font-weight:800">4th</small>'];
    const place = rk.findIndex(p => p.seat === 0);
    openCard(`<h2>${place === 0 ? `${g.players[0].name} wins the match! 🏆` : 'Match over'}</h2><p class="sub">${g.handsPlayed} hands played · ${g.players[0].name} finished ${['1st', '2nd', '3rd', '4th'][place]}${place === 0 ? ' — well played! 🐟' : ''}</p>
      ${rk.map((p, i) => `<div class="rank ${p.seat === 0 ? 'me' : ''}"><span class="md">${medals[i]}</span><span class="nm">${p.name}${p.seat ? ` <span class="lvl ${S.levels[p.seat]}">${LV[S.levels[p.seat]]}</span>` : ''}</span><span class="sc">${p.score}</span></div>`).join('')}
      <div class="ovb"><button data-k="setup">Setup</button><button class="go" data-k="again">Play again</button></div>`, c => {
      c.querySelector('[data-k=setup]').onclick = () => { $('overlay').hidden = true; g = null; showSetup(); };
      c.querySelector('[data-k=again]').onclick = () => { $('overlay').hidden = true; startMatch(); };
    });
  }
  /* tile legend (Help + test sheet): one row per suit, then winds and dragons */
  function legendHTML(sizes) {
    const koi = S.THEME === 'koi', am = S.rules === 'american', cap = (t, txt) => `<figure>${tileT(t)}<figcaption>${txt}</figcaption></figure>`;
    const suits = koi ? [[1, 'Dots', 'bubbles', am ? 'Dots' : 'Dots'], [2, am ? 'Bams' : 'Bamboo', 'green reeds', 'Bams'], [0, am ? 'Craks' : 'Characters', 'numeral + red 萬', 'Craks']]
                      : [[0, am ? 'Craks' : 'Characters', 'red', ''], [1, 'Dots', 'blue', ''], [2, am ? 'Bams' : 'Bamboo', 'green', '']];
    const rowsOf = () => suits.map(([s, n, col, cl]) => `<div class="lgRow"><div class="lgLab"><b>${n}</b><small>${col}</small></div><div class="lgTiles">${Array.from({ length: 9 }, (_, r) => tileT(s * 9 + r)).join('')}</div></div>`).join('') +
      `<div class="lgRow"><div class="lgLab"><b>Winds</b><small>${koi ? 'letter + farm item' : 'E S W N'}</small></div><div class="lgTiles cap">${[27, 28, 29, 30].map((t, k) => cap(t, koi ? ['East', 'South', 'West', 'North'][k] + '<br>' + THEME.KOI_WIND_ITEM[k] : ['East', 'South', 'West', 'North'][k])).join('')}</div></div>` +
      `<div class="lgRow"><div class="lgLab"><b>Dragons</b><small>${koi ? 'framed specials' : 'white · green · red'}</small></div><div class="lgTiles cap">${[33, 32, 31].map(t => cap(t, (koi ? ['White', 'Green', 'Red'][t - 31] + '<br>' + THEME.KOI_DRAGON[t - 31] : ['White', 'Green', 'Red'][t - 31]) + (am && t === 31 ? '<br>= Soap (0)' : ''))).join('')}</div></div>` +
      (S.rules === 'american' || sizes ? `<div class="lgRow"><div class="lgLab"><b>American</b><small>specials</small></div><div class="lgTiles cap">${cap(42, 'Flower<br>(all alike)')}${cap(43, 'Joker<br>(wild in 3+)')}${cap(44, 'Blank<br>(house rule)')}</div></div>` : '');
    if (!sizes) return `<div class="legend">${rowsOf()}</div>`;
    return sizes.map(w => `<div class="legend" style="--w:${w}px"><div class="lgSize">${w}px tiles</div>${rowsOf()}</div>`).join('');
  }
  function showHelp() {
    const row = t => tileT(t, 'inl');
    if (S.rules === 'american') { $('helpCard').innerHTML = helpAM() + `<div class="ovb"><button class="go" id="helpClose">Back to game</button></div>`; $('help').hidden = false; $('helpCard').scrollTop = 0; $('helpClose').onclick = () => { $('help').hidden = true; if (g) schedule(200); }; return; }
    $('helpCard').innerHTML = `<h2>How to play</h2>
      <h3>Goal</h3><p>Be first to complete a hand of <b>4 melds + 1 pair</b> (14 tiles). A meld is a <b>chow</b> (3 in a row, same suit), a <b>pung</b> (3 identical) or a <b>kong</b> (4 identical). ${S.sevenPairs ? '<b>Seven pairs</b> (7 different pairs, concealed) also wins.' : ''}</p>
      <div class="tiles">${[0, 1, 2].map(row).join('')}&nbsp;${[13, 13, 13].map(row).join('')}&nbsp;${[31, 31, 31, 31].map(row).join('')}&nbsp;${[33, 33].map(row).join('')}</div>
      <h3>Tiles (136)</h3><p>Three suits numbered 1-9, four winds and three dragons, four copies of each (34 kinds).${S.flowers ? ' Flowers/seasons are on: they are set aside when drawn (+1 fan each) and replaced.' : ''}${S.THEME === 'koi' ? ' In the <b>Goldfish &amp; Koi</b> set the suits keep their classic shapes in pond colours: <b>Dots</b> are round bubbles, <b>Bamboo</b> are green reeds (the 1 is a koi), <b>Characters</b> show a numeral over a red 萬. The corner number is the rank.' : ''}</p>
      ${legendHTML()}
      <h3>A turn</h3><ul><li>Draw a tile (automatic), then <b>discard</b> one: tap a tile to lift it, tap it again (or press Discard).</li>
      <li>If your 14 tiles are complete, press <b>Win!</b> (self-drawn). With four identical tiles (or a drawn tile matching your exposed pung) you may declare a <b>Kong</b> and draw a replacement.</li></ul>
      <h3>Claiming discards</h3><ul><li><b>Win</b>: anyone, highest priority (if several, the first in turn order wins).</li>
      <li><b>Pung / Kong</b>: anyone holding 2 / 3 matching tiles. Beats chow.</li><li><b>Chow</b>: only the next player (the one after the discarder).</li>
      <li>Claimed melds are shown face up; after a pung/chow you discard, after a kong you draw a replacement first. Only a win may be claimed on the very last discard.</li></ul>
      <p>When you can claim, big buttons appear (choose between chow options if there are several). Enable <i>auto-pass</i> in setup to skip non-win offers.</p>
      <h3>Scoring (fan)</h3><table class="bd">${MJ.FAN_TABLE.filter(r => S.flowers || r[0] !== 'Flower').filter(r => S.sevenPairs || r[0] !== 'Seven pairs').map(r => `<tr><td>${r[0]}<br><small style="opacity:.7">${r[2]}</small></td><td>+${r[1]}</td></tr>`).join('')}</table>
      <p>Hand value = fan (max ${S.fanLimit}) × ${S.pointUnit}. <b>Self-drawn</b>: each of the other three pays the value. <b>Win on a discard</b>: the discarder alone pays <b>double</b>. Everyone starts with ${S.startPoints} points.</p>
      <h3>Dealer & rounds</h3><p>The dealer (<span class="dealer">D</span>, seat wind East 東) keeps the deal after winning or after a draw game (wall exhausted; a 14-tile dead wall is kept for kong replacements). Otherwise the deal passes to the next player. Quick game = 4 hands; East round ends when every player has dealt; East+South = two rounds (the prevailing wind becomes South).</p>
      <h3>Opponents</h3><ul><li><span class="lvl easy">Easy</span> keeps pairs and neighbours loosely, makes random mistakes, calls on a whim.</li>
      <li><span class="lvl medium">Medium</span> plays efficiently: always discards to get closer to ready and keep the most useful waits; calls only when it helps.</li>
      <li><span class="lvl hard">Hard</span> also counts visible tiles, looks one draw ahead for better waits, leans to flushes/pungs when close, and defends (throws safe tiles) against players who look ready.</li></ul>
      <h3>On a phone / tablet</h3><ul><li>Your hand is at the bottom; the newly drawn tile sits slightly apart.</li><li>The glowing tile is the latest discard. The arrow in the centre shows whose turn it is.</li>
      <li>Top bar: ? help · 👁 show AI hands · ↻ restart hand · New = back to setup.</li><li>Tile set (Goldfish &amp; Koi or Classic) is chosen on the setup screen. On iPad/iPhone Safari: Share → <i>Add to Home Screen</i> to play full-screen.</li></ul>
      <div class="ovb"><button class="go" id="helpClose">Close</button></div>`;
    $('help').hidden = false; $('helpCard').scrollTop = 0;
    $('helpClose').onclick = () => { $('help').hidden = true; if (g) schedule(200); };
  }

  /* ==========================================================================
     AMERICAN MODE UI (included inside App by build.py; shares its helpers)
     - persistent "Your top 5 hands" panel (#hints), live after every change
     - Charleston screens, turn buttons (Mahjong / Joker swap / Blank swap),
       claim prompt (Mahjong / Pung / Kong / Quint / Pass)
     - full card view (#cardView, pauses the game), result screen, help
     ========================================================================== */
  let chSel = [], chNew = [], pin = null, hintsOpen = false, jokerPick = false;
  const AMmode = () => !!(g && g.rules === 'am');
  const DIRS = { right: ['➡', 'RIGHT'], across: ['⬆', 'ACROSS'], left: ['⬅', 'LEFT'] };
  const DIRSEAT = { right: 1, across: 2, left: 3 };

  /* ---- mini "card tiles" (chips) for the hints panel ---- */
  function chip(t, sym, state) {
    let cls = 'chip ' + state, txt;
    if (t === AM.JOKER) { cls += ' jk'; txt = 'J'; }
    else if (t < 27) { cls += ' c' + Math.floor(t / 9); txt = t % 9 + 1; }
    else if (t < 31) { cls += ' wd'; txt = 'ESWN'[t - 27]; }
    else if (t < 34) { cls += ' d' + 'WGR'[t - 31]; txt = sym === '0' ? '0' : 'D'; }
    else if (t === AM.FLOWER) { cls += ' fl'; txt = 'F'; }
    else { cls += ' bl'; txt = '·'; }
    return `<span class="${cls}" title="${tileName(t)}">${txt}</span>`;
  }
  function chipsHTML(arr) {
    let html = '', open = false;
    for (const grp of arr.groups) {
      const newCluster = grp.n > 1 || grp.first !== false;
      if (newCluster) { if (open) html += '</span>'; html += `<span class="cg${grp.exposed ? ' ex' : ''}">`; open = true; }
      html += grp.ids.map(id => chip(typeOf(id) === AM.JOKER ? AM.JOKER : grp.t, grp.sym, 'have')).join('') + chip(grp.t, grp.sym, 'miss').repeat(grp.missing);
    }
    return html + (open ? '</span>' : '');
  }
  function topHands(n = 5) {
    const me = g.players[0], all = AM.closest(me.hand, AM.expsOf(me), 999);
    const top = all.slice(0, n);
    if (pin) { const ph = all.find(h => h.hand.id === pin); if (!ph) pin = null; else return [ph, ...top.filter(h => h !== ph)].slice(0, n); }  // pinned target first (visible when collapsed)
    return top;
  }
  function renderHints() {
    const el = $('hints');
    if (!AMmode()) { el.hidden = true; return; }
    el.hidden = false;
    const tablet = K >= 1.25, land = matchMedia(LAND_MQ).matches;
    if (!S.hints) { el.innerHTML = `<div class="hhead"><button data-h="show">💡 Show closest hands</button><button class="fc" data-h="card">📋 Full card</button></div>`; el.className = 'off'; return; }
    const top = topHands(5), me = g.players[0];
    const show = hintsOpen || tablet || land ? top.length : Math.min(2, top.length);
    const rows = top.slice(0, show).map(h => {
      const arr = AM.arrange(h.v, me.hand, me.melds);
      return `<div class="hrow${pin === h.hand.id ? ' pin' : ''}" data-hid="${h.hand.id}">
        <span class="hneed${h.need === 0 ? ' mj' : ''}" title="tiles still needed">${h.need === 0 ? '✓' : h.need}</span>
        <span class="hchips">${chipsHTML(arr)}</span>
        <span class="hmeta"><b>${h.hand.pts}</b>${h.hand.x ? '' : '<i class="c" title="concealed: no calling">C</i>'}${pin === h.hand.id ? '<small>📌</small>' : ''}</span></div>`;
    }).join('');
    el.className = hintsOpen ? 'open' : '';
    el.innerHTML = `<div class="hhead"><span class="ht">🐟 Closest hands</span><span class="hsub">${pin ? '📌 pinned · tap to unpin' : 'tap one to aim for it'}</span>
      ${tablet || land ? '' : `<button data-h="more">${hintsOpen ? '▴ Less' : '▾ More'}</button>`}<button class="fc" data-h="card">📋 Full card</button><button data-h="hide" aria-label="Hide hints">✕</button></div>
      <div class="hrows">${rows || '<div class="hnone">No card hand fits your exposures.</div>'}</div>`;
  }
  function keepSet() {       // tiles of the pinned target (highlighted in the hand)
    if (!AMmode() || !pin || !S.hints) return null;
    const me = g.players[0], h = topHands(5).find(x => x.hand.id === pin); if (!h) return null;
    const arr = AM.arrange(h.v, me.hand, me.melds), s = new Set();
    for (const grp of arr.groups) if (!grp.exposed) for (const id of grp.ids) s.add(id);
    return s;
  }
  $('hints').addEventListener('click', e => {
    const b = e.target.closest('[data-h]');
    if (b) {
      const k = b.dataset.h;
      if (k === 'card') return showCardView();
      if (k === 'more') hintsOpen = !hintsOpen;
      if (k === 'hide') { S.hints = false; save(); }
      if (k === 'show') { S.hints = true; save(); }
      return render();
    }
    const r = e.target.closest('.hrow'); if (r) { pin = pin === r.dataset.hid ? null : r.dataset.hid; render(); }
  });

  /* ---- centre box + action bar ---- */
  function centerAM() {
    if (g.phase === 'charleston') {
      const c = g.ch;
      if (c.stage === 'vote') return `<div class="rw">⇄</div><div class="turn">Charleston<br>vote</div>`;
      const d = g.chDir();
      return `<div class="charrow big">${DIRS[d][0]}</div><div class="turn">Pass ${d}</div>`;
    }
    return null;
  }
  function renderActionsAM() {
    const A = $('actions');
    if (g.phase === 'charleston') {
      const c = g.ch;
      if (c.stage === 'vote') {
        A.innerHTML = `<div class="abtns"><button class="go" data-act="ch:yes">Yes, pass again</button><button data-act="ch:no">No, stop</button></div>`;
        return;
      }
      const d = g.chDir(), to = g.players[DIRSEAT[d]].name;
      if (c.stage === 'courtesy') {
        A.innerHTML = `<div class="abtns"><button class="go" data-act="ch:pass">${chSel.length ? `Pass ${chSel.length} across ${DIRS.across[0]}` : 'Skip (pass none)'}</button></div>`;
        return;
      }
      A.innerHTML = c.picks[0] ? '' : `<div class="abtns"><button class="go" data-act="ch:pass" ${chSel.length !== 3 ? 'disabled' : ''}>Pass ${DIRS[d][0]} to ${to}</button></div>`;
      return;
    }
    if (humanClaim()) {
      const o = g.claim.options[0], t = typeOf(g.claim.id), from = g.players[g.claim.from].name, me = g.players[0];
      const nat = me.hand.filter(id => typeOf(id) === t).length;
      let b = '';
      if (o.mahjong) b += '<button class="win" data-act="claim:mahjong">Mahjong!</button>';
      for (const n of o.calls) { const jk = Math.max(0, n - 1 - nat); b += `<button class="go" data-act="claim:call:${n}">${{ 3: 'Pung', 4: 'Kong', 5: 'Quint', 6: 'Sextet' }[n]}${jk ? `<small>+${jk} joker${jk > 1 ? 's' : ''}</small>` : ''}</button>`; }
      b += '<button data-act="claim:pass">Pass</button>';
      A.innerHTML = `<div class="claimq">${tileT(t)} <span>${from} discarded ${tileName(t)}</span></div><div class="abtns">${b}</div>`;
      return;
    }
    if (isHumanTurn()) {
      const o = g.turnOptions(0);
      if (jokerPick) {
        A.innerHTML = `<div class="claimq"><span>Swap your tile for a joker:</span></div><div class="abtns">${o.jokerSwaps.map((js, i) => `<button class="go chow" data-act="js:${i}"><span class="row">${tileT(js.t)}⇄${tileT(AM.JOKER)}</span>${g.players[js.owner].name}</button>`).join('')}<button data-act="cancel">Back</button></div>`;
        return;
      }
      let b = '';
      if (o.mahjong) b += '<button class="win" data-act="mahjong">Mahjong!</button>';
      if (o.jokerSwaps.length) b += '<button class="go sm" data-act="jokermenu">Joker swap</button>';
      if (o.blankSwap) b += '<button class="go sm" data-act="blankmenu">Blank swap</button>';
      if (sel != null) b += `<button class="go" data-act="discard">Discard</button>`;
      A.innerHTML = b ? `<div class="abtns">${b}</div>` : '';
      return;
    }
    A.innerHTML = '';          // nothing to press: the prompt line says who is playing
  }
  /* the one-line "what to do now" prompt above the hand */
  function promptAM() {
    if (g.phase === 'end' || g.phase === 'over') return '';
    if (g.phase === 'charleston') {
      const c = g.ch;
      if (c.stage === 'vote') return 'Pass again? Choose Yes or No';
      if (c.picks[0]) return 'Waiting for the others to pass…';
      if (c.stage === 'courtesy') return `Optional: pick up to 3 tiles to pass ${DIRS.across[0]} across${chSel.length ? ` (${chSel.length} picked)` : ''}`;
      const d = g.chDir();
      return `Pick 3 tiles to pass ${DIRS[d][0]} ${d}${chSel.length ? ` (${chSel.length}/3)` : ''}`;
    }
    if (humanClaim()) { const o = g.claim.options[0]; return `${g.players[g.claim.from].name} threw ${tileName(typeOf(g.claim.id))}: ${o.mahjong ? 'Mahjong is yours!' : 'take it or Pass'}`; }
    if (isHumanTurn()) {
      if (jokerPick) return 'Pick the joker swap you want';
      if (g.turnOptions(0).mahjong) return '🎉 You have Mahjong! Tap Mahjong!';
      return sel == null ? 'Your turn: tap a tile to discard' : `Tap ${tileName(typeOf(sel))} again to discard it`;
    }
    if (g.phase === 'claim') return 'Waiting for calls…';
    return g.current === 0 ? 'Playing for you…' : `${g.players[g.current].name} is playing…`;
  }
  function helpLineAM() {
    const me = g.players[0], top = AM.closest(me.hand, AM.expsOf(me), 1)[0];
    if (!top) return 'No card hand fits';
    if (top.need === 0 && me.hand.length + me.melds.reduce((a, m) => a + m.n, 0) === 14) return '<b>Mahjong! Tap it</b>';
    return `Closest: ${top.hand.id} · ${top.need} away`;
  }

  /* ---- input ---- */
  function onHandTapAM(id) {
    if (g.phase === 'charleston') {
      const c = g.ch; if (c.stage === 'vote' || c.picks[0]) return;
      if (typeOf(id) === AM.JOKER) { callout('Jokers can’t be passed'); return; }
      const max = 3, i = chSel.indexOf(id);
      if (i >= 0) chSel.splice(i, 1); else if (chSel.length < max) chSel.push(id);
      return render();
    }
    if (!isHumanTurn() || jokerPick) return;
    if (sel === id) { g.act(0, { type: 'discard', id }); return after(); }
    sel = id; render();
  }
  function onActionAM(act) {
    if (act === 'ch:pass') {
      const ok = g.chSubmit(0, chSel.slice()); if (!ok) return;
      chSel = []; return schedule(60);
    }
    if (act === 'ch:yes' || act === 'ch:no') { g.chVote(0, act === 'ch:yes'); return schedule(60); }
    if (act === 'discard' && sel != null && isHumanTurn()) { g.act(0, { type: 'discard', id: sel }); return after(); }
    if (act === 'mahjong' && isHumanTurn()) { g.act(0, { type: 'mahjong' }); return after(); }
    if (act === 'jokermenu') { jokerPick = true; return render(); }
    if (act === 'cancel') { jokerPick = false; return render(); }
    if (act.startsWith('js:') && isHumanTurn()) { const js = g.turnOptions(0).jokerSwaps[+act.slice(3)]; jokerPick = false; if (js) g.act(0, { type: 'jokerSwap', owner: js.owner, mi: js.mi, id: js.id }); scanLog(); sel = null; return render(); }
    if (act === 'blankmenu') return blankPicker();
    if (act.startsWith('claim:') && humanClaim()) {
      const [, type, n] = act.split(':');
      g.respond(0, type === 'call' ? { type: 'call', n: +n } : { type });
      return after(120);
    }
  }
  function blankPicker() {
    const T = g.blankTargets();
    const bySeat = [0, 1, 2, 3].map(s => T.filter(x => x.seat === s));
    openCard(`<h2>Blank swap</h2><p class="sub">Exchange a blank from your hand for any discard (not a joker). Tap the tile you want.</p>
      ${bySeat.map((list, s) => list.length ? `<div class="bpRow"><b>${g.players[s].name}</b><div class="bpTiles">${list.map(x => `<button class="bpT" data-bs="${x.seat}:${x.idx}">${tile(x.id)}</button>`).join('')}</div></div>` : '').join('')}
      <div class="ovb"><button data-k="no">Cancel</button></div>`, c => {
      c.querySelector('[data-k=no]').onclick = () => { $('overlay').hidden = true; };
      c.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => {
        const [s, i] = b.dataset.bs.split(':').map(Number); $('overlay').hidden = true;
        if (isHumanTurn()) { g.act(0, { type: 'blankSwap', seat: s, idx: i }); callout('Blank swapped 🤫'); sel = null; render(); }
      });
    });
  }

  /* ---- loop ---- */
  function stepAM() {
    if (g.phase === 'charleston') {
      const c = g.ch, before = c.idx + ':' + c.stage;
      const rec0 = JSON.stringify(c.received[0] || []);
      for (const s of [1, 2, 3]) if (g.phase === 'charleston') AMAI.autoCharleston(g, s, levelOf(s), rng);
      if (g.phase === 'charleston' && autoHuman) AMAI.autoCharleston(g, 0, 'medium', rng);
      if (g.phase === 'charleston' && (c.idx + ':' + c.stage) === before) { render(); return; }   // wait for the human
      if (g.ch && JSON.stringify(g.ch.received[0] || []) !== rec0) chNew = (g.ch.received[0] || []).slice();
      if (g.phase !== 'charleston') chNew = [];
      render(); return schedule(Math.max(250, delay()));
    }
    if (g.phase === 'discard') {
      if (isHumanTurn()) { render(); return; }
      const s = g.current, a = autoHuman && s === 0 ? AMAI.chooseTurn(g, 0, 'medium', rng) : AMAI.chooseTurn(g, s, levelOf(s), rng);
      g.act(s, a);
      if (a.type === 'jokerSwap' || a.type === 'blankSwap') { scanLog(); render(); return schedule(Math.max(300, delay())); }
      return after();
    }
    if (g.phase === 'claim') {
      for (const k in g.claim.options) {
        const s = +k; if (s === 0 || k in g.claim.responses) continue;
        g.respond(s, AMAI.chooseClaim(g, s, g.claim.options[k], levelOf(s), rng));
        if (g.phase !== 'claim') return after();
      }
      if (humanClaim()) {
        const o = g.claim.options[0];
        if (autoHuman) g.respond(0, AMAI.chooseClaim(g, 0, o, 'medium', rng));
        else if (S.autoPass && !o.mahjong) g.respond(0, { type: 'pass' });
        else { render(); return; }
      }
      return after();
    }
  }

  /* ---- full card view (game pauses while open) ---- */
  function patHTML(h) {
    return h.pat.split(/\s+/).map(tok => {
      if (tok === '+' || tok === '=') return `<span class="op">${tok}</span>`;
      const suit = /[abc]$/.test(tok) ? tok.slice(-1) : null, body = suit ? tok.slice(0, -1) : tok;
      return `<span class="tk ${suit ? 'k' + suit : 'kn'}">${body}</span>`;
    }).join(' ');
  }
  function showCardView() {
    const top = g && AMmode() ? topHands(5) : [], needOf = {};
    top.forEach((h, i) => { needOf[h.hand.id] = { need: h.need, rank: i + 1 }; });
    const secs = [];
    for (const h of AM.CARD.hands) { let s = secs.find(x => x.name === h.sec); if (!s) secs.push(s = { name: h.sec, hands: [] }); s.hands.push(h); }
    const FISH = ['🐟', '🪷', '🎏', '🔁', '🍥', '🥫', '🎣', '🌬️', '🫧', '🐠'];
    $('cardViewIn').innerHTML = `<div class="cvTop"><button class="back" data-cv="close">← Back to game</button><span class="cvTitle">📋 ${esc(AM.CARD.name)}</span><button class="x" data-cv="close" aria-label="Close">✕</button></div>
      <div class="cvBody">
        <div class="cvLegend"><span class="tk ka">green</span> <span class="tk kb">red</span> <span class="tk kc">blue</span> = three different suits (any order) · <b>0</b> = Soap (White dragon) · <b>D</b> = dragon of that suit's colour · <b>F</b> = flower · <b>X</b> exposed OK · <b>C</b> concealed only. Jokers only in groups of 3+.${top.length ? ' Highlighted lines are your closest hands; tap a line to target it.' : ''}</div>
        ${secs.map((s, si) => `<div class="cvSec"><div class="cvSecH">${FISH[si % FISH.length]} ${esc(s.name)}</div>
          ${s.hands.map(h => { const n = needOf[h.id]; return `<div class="cvLine${n ? ' near' : ''}${pin === h.id ? ' pin' : ''}" data-cvh="${h.id}">
            <span class="cvId">${h.id}</span><span class="cvPat">${patHTML(h)}<small>${esc(h.note || '')}</small></span>
            <span class="cvVal"><i class="${h.x ? 'x' : 'c'}">${h.x ? 'X' : 'C'}</i><b>${h.pts}</b>${n ? `<em>${n.need === 0 ? 'MJ!' : n.need + ' away'}</em>` : ''}</span></div>`; }).join('')}</div>`).join('')}
      </div>`;
    $('cardView').hidden = false; $('cardViewIn').querySelector('.cvBody').scrollTop = 0;
  }
  $('cardView').addEventListener('click', e => {
    if (e.target.id === 'cardView' || e.target.closest('[data-cv=close]')) { $('cardView').hidden = true; if (g) { render(); schedule(250); } return; }
    const l = e.target.closest('[data-cvh]');
    if (l && g && AMmode()) { pin = pin === l.dataset.cvh ? null : l.dataset.cvh; showCardView(); render(); }
  });

  /* ---- result screen ---- */
  function showResultAM() {
    const r = g.result; render();
    let html;
    if (r.type === 'draw') html = `<h2>Wall game</h2><p class="sub">The wall ran out; nobody made Mahjong. The deal passes to ${g.players[(g.dealer + 1) % 4].name}.</p>${scoreTable()}`;
    else {
      const p = g.players[r.seat], h = r.match.hand;
      const how = r.selfDrawn ? 'Self-drawn — everyone pays double' : `On ${g.players[r.from].name}'s discard — ${g.players[r.from].name} pays double, others single`;
      const groups = r.arrangement.groups.map(grp => `<div class="grp${grp.exposed ? ' ex' : ''}">${grp.ids.map(id => tile(id, id === r.winTile ? 'win' : '')).join('')}</div>`).join('');
      html = `<h2>${r.seat === 0 ? `${esc(p.name)} wins! 🐟` : `${esc(p.name)}: Mahjong! 🐠`}</h2><p class="sub">${how}</p>
        <div class="cvLine near won"><span class="cvId">${h.id}</span><span class="cvPat">${patHTML(h)}<small>${esc(h.sec)} · ${esc(h.note || '')}</small></span><span class="cvVal"><i class="${h.x ? 'x' : 'c'}">${h.x ? 'X' : 'C'}</i><b>${h.pts}</b></span></div>
        <div class="whand">${groups}</div>
        <table class="bd"><tr><td>Card hand ${h.id}</td><td>${r.base}</td></tr>
        ${r.jokerless ? `<tr><td>Jokerless bonus</td><td>×2</td></tr>` : (r.match.jokersOk ? '' : `<tr><td>Singles &amp; pairs (always jokerless, no bonus)</td><td>—</td></tr>`)}
        <tr class="tot"><td>Hand value</td><td>${r.value} pts</td></tr></table>
        <h3 style="margin:12px 0 4px;font-size:15px">Payments</h3>${scoreTable()}`;
    }
    openCard(html + `<div class="ovb"><button class="go" data-k="next">${g.handsPlayed + 1 >= g.maxHands ? 'Final results' : 'Next hand'}</button></div>`, c => {
      c.querySelector('[data-k=next]').onclick = () => { $('overlay').hidden = true; chSel = []; chNew = []; pin = null; g.nextHand(rigNext ? { rig: rigNext, skipCharleston: rigNext.skipCharleston } : undefined); rigNext = null; logSeen = g.log.length; after(400); };
    });
  }

  /* ---- help (American) ---- */
  function helpAM() {
    const row = t => tileT(t, 'inl');
    return `<h2>How to play (American)</h2>
      <p>American (NMJL-style) Mahjong with <b>${esc(AM.CARD.name)}</b>, an original sample card made for this game. Build one of the card's 14-tile hands exactly.</p>
      <h3>Tiles (${152 + (S.blanks || 0)})</h3><p>Three suits 1-9 (Crak, Dot, Bam)${S.THEME === 'koi' ? ' in their classic shapes: <b>Dots</b> = round bubbles, <b>Bams</b> = green reeds (1 Bam is a koi), <b>Craks</b> = numeral over a red 萬; the corner number is the rank' : ''}, 4 winds, 3 dragons (4 of each), 8 flowers ${row(42)}, 8 jokers ${row(43)}${S.blanks ? ` and ${S.blanks} blanks ${row(44)} (house rule)` : ''}. The White dragon is also called <b>Soap</b> and counts as <b>0</b> in year hands like 2026.</p>
      ${legendHTML()}
      <h3>The Charleston</h3><ul><li>Before play everyone passes 3 unwanted tiles: <b>right ➡, across ⬆, left ⬅</b> (mandatory).</li>
      <li>Then a vote: if all agree, a second Charleston <b>left, across, right</b>. Anyone may stop it.</li>
      <li>Finally an optional <b>courtesy pass</b> across (0-3 tiles; the smaller number is swapped).</li><li>Jokers can never be passed. (Blind passing is not used in this app.)</li>
      <li>Tap tiles to select them, then press <b>Pass</b>. Use the <i>top 5 hands</i> panel to decide what to keep.</li></ul>
      <h3>Playing</h3><ul><li>East (the dealer, <span class="dealer">D</span>) starts with 14 tiles and discards first. Then each player draws and discards, turning to the right.</li>
      <li><b>Calling</b>: you may call a discard to expose a <b>pung</b> (3), <b>kong</b> (4) or <b>quint</b> (5) - only if that exposure fits a card hand. No chows. A pair or single can only be called to finish Mahjong. Mahjong beats other calls; otherwise the next player in turn wins ties.</li>
      <li><b>Jokers</b> replace any tile in a group of 3 or more (never in a single or a pair). A discarded joker is dead.</li>
      <li><b>Joker swap</b>: on your turn, give the real tile to take a joker out of any exposure.</li>
      ${S.blanks ? '<li><b>Blank swap</b> (house rule): on your turn, secretly exchange a blank from your hand for any discard except a joker. Blanks can be passed in the Charleston but can never be called or used in a winning hand.</li>' : ''}
      <li>Declare <b>Mahjong!</b> on your draw or on a discard. It is checked strictly against the card (exposed hands can't win with a C hand). If the wall runs out it's a <b>wall game</b>.</li></ul>
      <h3>Reading the card</h3><ul><li>Each line is one hand of 14 tiles. <span class="tk ka">Green</span>, <span class="tk kb">red</span> and <span class="tk kc">blue</span> mean three <i>different</i> suits - which suit is which is up to you. One colour = one suit.</li>
      <li><b>1111</b> = kong of 1s, <b>2026</b> = the single tiles 2, Soap, 2, 6. <b>D</b> = the dragon of that colour's suit (Crak-Red, Bam-Green, Dot-Soap). <b>F</b> = flower. "Any like number" / "consecutive" hands may use other numbers.</li>
      <li><b>X</b> = exposed calls allowed, <b>C</b> = concealed only. The number is the value.</li></ul>
      <h3>Your top 5 hands</h3><p>The panel above your hand lists the 5 card hands closest to your tiles: solid tiles you hold, dashed ones you still need, gold <b>J</b> = a joker filling in, and how many tiles away you are. Tap one to target it: its tiles get a green mark in your hand. <b>📋 Full card</b> shows the whole card (the game pauses; <i>Back to game</i> returns).</p>
      <h3>Scoring</h3><ul><li>The winner gets the card value. <b>On a discard</b>: the discarder pays double, the others pay the value once. <b>Self-drawn</b>: everyone pays double.</li>
      <li><b>Jokerless</b>: value doubled (not for singles &amp; pairs hands, which never use jokers). Everyone starts with ${S.startPoints} points; the deal passes after every hand.</li></ul>
      <h3>Opponents</h3><ul><li><span class="lvl easy">Easy</span> aims loosely at one hand, passes random tiles, rarely calls, never swaps jokers, sometimes misses Mahjong.</li>
      <li><span class="lvl medium">Medium</span> measures every card hand, commits to its best 3, passes/discards what those don't need, calls when it helps, swaps jokers and blanks.</li>
      <li><span class="lvl hard">Hard</span> also counts which tiles are still live, weighs value against speed, stays flexible, avoids feeding exposed opponents late in the hand, never throws jokers and saves blanks for key discards.</li></ul>
      <h3>On a phone / tablet</h3><ul><li>Top bar: ? help · 👁 show AI hands · ↻ restart hand · New = setup. Share → <i>Add to Home Screen</i> in Safari for full-screen play.</li></ul>`;
  }


  /* ---------- setup screen ---------- */
  const esc = x => String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function seg(key, opts, cur, extraCls = '') {
    return `<div class="seg" data-key="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''} ${extraCls ? v : ''}">${l}</button>`).join('')}</div>`;
  }
  let moreOpen = false;
  function showSetup() {
    $('game').hidden = true; $('setup').hidden = false; $('help').hidden = true;
    const lv = [['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']];
    const pos = { 1: 'right', 2: 'across', 3: 'left' };
    $('setupIn').innerHTML = `<div class="logo"><div class="tiles">${(S.THEME === 'koi' ? [9, 22, 4, 33, 32] : [31, 32, 33, 27]).map(t => tileT(t)).join('')}</div><h1>${S.THEME === 'koi' ? 'Bizy&rsquo;s Goldfish &amp; Koi Mahjong' : 'Bizy&rsquo;s Mahjong'}</h1><p class="welcome">Welcome back, ${esc(pname())}! 🐟</p><p>${S.rules === 'american' ? 'American rules · ' + esc(AM.CARD.name) : 'Hong Kong-style'} · you vs three computer players</p></div>
      <div class="sect"><div class="row2"><div class="lab">Your name</div><input id="pName" class="nameIn" maxlength="14" value="${esc(pname())}" autocomplete="off" autocapitalize="words"></div>
        <div class="row2"><div class="lab">Opponents</div>${seg('lvall', lv, S.levels.slice(1).every(l => l === S.levels[1]) ? S.levels[1] : '', 'c')}</div>
        <div class="row2"><div class="lab">Game length</div>${seg('length', S.rules === 'american' ? [['quick', '4 hands'], ['east', '8 hands'], ['full', '16 hands']] : [['quick', '4 hands'], ['east', 'East round'], ['full', 'East+South']], S.length)}</div></div>
      <button class="startBtn top" id="bStart">▶ Start game</button>
      <details class="more" id="moreOpts"${moreOpen ? ' open' : ''}><summary>⚙️ More options ${moreOpen ? '▴' : '▾'}</summary>
      <div class="sect"><h3>Opponents one by one</h3>
        ${[1, 2, 3].map(s => `<div class="row2"><div class="lab">${S.names[s]}<small>sits ${pos[s]}</small></div>${seg('lv' + s, lv, S.levels[s], 'c')}</div>`).join('')}</div>
      <div class="sect"><h3>Game</h3>
        <div class="row2"><div class="lab">Rules</div>${seg('rules', [['american', '🇺🇸 American'], ['hk', 'Hong Kong']], S.rules)}</div>
        ${S.rules === 'american' ? `<div class="row2"><div class="lab">Blanks<small>house rule</small></div>${seg('blanks', [[0, 'None'], [4, '4 blanks'], [6, '6 blanks']], S.blanks)}</div>` : ''}
        <div class="row2"><div class="lab">AI speed</div>${seg('speed', [['normal', 'Normal'], ['fast', 'Fast'], ['turbo', 'Turbo']], S.speed)}</div>
        <div class="row2"><div class="lab">Start points</div>${seg('startPoints', [[500, '500'], [1000, '1000'], [2000, '2000']], S.startPoints)}</div>
        <div class="row2"><div class="lab">Tiles<small>theme</small></div>${seg('THEME', [['koi', '🐟 Goldfish &amp; Koi'], ['classic', '🀄 Classic']], S.THEME)}</div></div>
      <div class="sect"><h3>Options</h3>
        ${(S.rules === 'american' ? [['hints', 'Top 5 hands panel', 'Closest card hands shown while you play'], ['autoPass', 'Auto-pass calls', 'Skip pung/kong/quint offers (Mahjong still asked)'], ['revealAI', 'Show AI hands', 'Learning / debug view']]
            : [['autoPass', 'Auto-pass claims', 'Skip chow/pung/kong offers (wins still asked)'], ['revealAI', 'Show AI hands', 'Learning / debug view'], ['sevenPairs', 'Seven pairs', 'Allow the special hand'], ['flowers', 'Flowers & seasons', '8 bonus tiles, +1 fan each']])
          .map(([k, l, d]) => `<div class="tog"><div>${l}<small>${d}</small></div><button class="sw ${S[k] ? 'on' : ''}" data-tog="${k}" aria-label="${l}"></button></div>`).join('')}</div>
      </details>
      <button class="linkBtn" id="bRules">How to play</button>${S.rules === 'american' ? '<button class="linkBtn" id="bCard">📋 View the card</button>' : ''}`;
    const box = $('setupIn');
    $('moreOpts').addEventListener('toggle', e => { moreOpen = e.target.open; e.target.querySelector('summary').textContent = `⚙️ More options ${moreOpen ? '▴' : '▾'}`; });
    box.querySelectorAll('.seg').forEach(sg => sg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const key = sg.dataset.key, v = b.dataset.v;
      if (key === 'lvall') S.levels = [null, v, v, v];
      else if (key.startsWith('lv')) S.levels[+key.slice(2)] = v;
      else S[key] = key === 'startPoints' || key === 'blanks' ? +v : v;
      if (key === 'THEME') { try { localStorage.setItem('mj4-theme', v); } catch (e) {} applyTheme(); }
      save(); showSetup();
    }));
    box.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => { S[b.dataset.tog] = !S[b.dataset.tog]; save(); b.classList.toggle('on', S[b.dataset.tog]); });
    $('pName').addEventListener('change', e => { S.playerName = e.target.value.trim() || CONFIG.playerName; save(); showSetup(); });
    $('bStart').onclick = () => { const v = $('pName').value.trim(); if (v) { S.playerName = v; save(); } startMatch(); };
    $('bRules').onclick = showHelp;
    if ($('bCard')) $('bCard').onclick = showCardView;
  }

  function startMatch(opts = {}) {
    clearTimeout(timer);
    const names = [pname(), ...S.names.slice(1)];
    g = S.rules === 'american'
      ? new AM.Game({ names, length: S.length, blanks: S.blanks, startPoints: S.startPoints, seed: opts.seed ?? S.seed })
      : new MJ.Game({ names, length: S.length, flowers: S.flowers, sevenPairs: S.sevenPairs, startPoints: S.startPoints,
      pointUnit: S.pointUnit, fanLimit: S.fanLimit, seed: opts.seed ?? S.seed });
    chSel = []; chNew = []; pin = null; jokerPick = false;
    rng = MJ.makeRng(opts.seed ?? S.seed ?? undefined);
    sel = null; kongPick = false; logSeen = 0;
    $('setup').hidden = true; $('game').hidden = false; $('overlay').hidden = true;
    g.startHand(opts.rig ? { rig: opts.rig, rigDraws: opts.rigDraws, skipCharleston: opts.skipCharleston } : (opts.skipCharleston ? { skipCharleston: true } : undefined));
    logSeen = g.log.length;
    render(); schedule(500);
  }

  showSetup();
  /* Debug / test hook */
  return {
    get game() { return g; }, get settings() { return S; }, set: (k, v) => { S[k] = v; }, startMatch, step, render,
    legendSheet: sizes => { $('helpCard').innerHTML = `<h2>Tile guide</h2>${legendHTML(sizes)}`; $('help').hidden = false; }, applyTheme: th => { S.THEME = th; applyTheme(); if (g) render(); else showSetup(); },
    tapTile: onHandTap, action: onAction, setAutoHuman: v => { autoHuman = !!v; if (g) schedule(0); }, rigNextHand: r => { rigNext = r; },
    state: () => g && ({ phase: g.phase, current: g.current, hand: g.players[0].hand.length, handNo: g.handNo, handsPlayed: g.handsPlayed,
      overlay: !$('overlay').hidden, cardTitle: $('card').querySelector('h2')?.textContent, claimShown: !!document.querySelector('#actions [data-act^="claim:"]'),
      tiles: g.tileCount(), scores: g.players.map(p => p.score), am: AMmode(), chStage: AMmode() && g.phase === 'charleston' ? g.ch.stage : null, chIdx: AMmode() && g.ch ? g.ch.idx : null, pin }),
    pinHand: id => { pin = id; render(); }, showCardView, get chSel() { return chSel; },
  };
})();
window.__mj = App;
</script>
</body>
</html>
